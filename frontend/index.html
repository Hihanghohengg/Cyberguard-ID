<!DOCTYPE html>
<html class="dark" lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuard-ID — SOC Platform Moderasi Komentar YouTube</title>
    <meta name="description" content="Platform skrining dan prioritisasi moderasi komentar YouTube berbahasa Indonesia menggunakan IndoBERT.">
    <meta name="theme-color" content="#051424">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'">
    <!-- Google Fonts: Inter, JetBrains Mono, & Material Symbols Outlined -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <!-- Vendor Libraries (Served locally for instant zero-latency loading) -->
    <script src="/static/js/vendor/chart.umd.min.js"></script>
    <script src="/static/js/vendor/lucide.min.js"></script>

    <!-- App CSS (Stitch Cyber Dark Design System) -->
    <link rel="stylesheet" href="/static/css/style.css?v=2.0.0">
</head>
<body class="dark-theme">
    <!-- Sidebar Navigation (Stitch SOC Style) -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon">
                    <span class="material-symbols-outlined text-primary" style="font-size: 22px;">shield</span>
                </div>
                <div class="logo-text">
                    <span class="logo-title">CyberGuard-ID</span>
                    <span class="logo-subtitle">Moderasi Komentar AI</span>
                </div>
            </div>
        </div>

        <div class="sidebar-nav">
            <a href="#/" class="nav-item active" data-page="home">
                <span class="material-symbols-outlined nav-icon" style="font-variation-settings: 'FILL' 1;">search</span>
                <span>Periksa Video</span>
            </a>
            <a href="#/results" class="nav-item" data-page="results">
                <span class="material-symbols-outlined nav-icon">analytics</span>
                <span>Hasil Analisis</span>
            </a>
            <a href="#/dataset" class="nav-item" data-page="dataset">
                <span class="material-symbols-outlined nav-icon">folder_open</span>
                <span>Kelola Data</span>
            </a>
        </div>

        </div>
    </nav>

    <!-- Mobile Header -->
    <header class="mobile-header" id="mobile-header">
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
            <span class="material-symbols-outlined">menu</span>
        </button>
        <span class="mobile-title">CyberGuard-ID</span>
    </header>

    <!-- Overlay for mobile sidebar -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
        <div class="page-container" id="page-container">
            <!-- Pages rendered here by JS router -->
            <div class="loading-screen">
                <div class="spinner"></div>
                <p>Memuat CyberGuard-ID...</p>
            </div>
        </div>
    </main>

    <!-- App-wide Confirmation Dialog Modal -->
    <div id="app-confirm-modal" class="modal-overlay hidden" style="position: fixed; inset: 0; z-index: 9999; background: rgba(3, 7, 18, 0.78); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 20px;">
        <div class="modal-card" style="max-width: 460px; width: 100%; padding: 26px; border: 1px solid var(--border-strong); background: var(--bg-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-xl); animation: modalPop 0.2s cubic-bezier(0.16, 1, 0.3, 1);">
            <div style="display: flex; align-items: flex-start; gap: 16px; margin-bottom: 20px;">
                <div style="width: 48px; height: 48px; border-radius: 12px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #f87171;">
                    <span class="material-symbols-outlined" style="font-size: 28px;">delete_forever</span>
                </div>
                <div style="flex: 1;">
                    <h3 id="confirm-modal-title" style="font-size: 1.25rem; font-weight: 800; color: #ffffff; margin-bottom: 8px;">Hapus Riwayat?</h3>
                    <div id="confirm-modal-desc" style="font-size: 0.95rem; color: var(--text-secondary); line-height: 1.55;">
                        Apakah Anda yakin ingin menghapus data ini? Tindakan ini tidak dapat dibatalkan.
                    </div>
                </div>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 12px;">
                <button type="button" class="btn btn-secondary" id="confirm-modal-cancel-btn" style="min-width: 90px;">Batal</button>
                <button type="button" class="btn btn-danger" id="confirm-modal-ok-btn" style="min-width: 120px; background: #dc2626; border-color: #ef4444; color: #ffffff; font-weight: 700;">Hapus</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- App JavaScript -->
    <script src="/static/js/api.js?v=2.0.0"></script>
    <script src="/static/js/components/toast.js?v=2.0.0"></script>
    <script src="/static/js/components/progress.js?v=2.0.0"></script>
    <script src="/static/js/components/charts.js?v=2.0.0"></script>
    <script src="/static/js/components/table.js?v=2.0.0"></script>
    <script src="/static/js/pages/home.js?v=2.0.0"></script>
    <script src="/static/js/pages/analyze.js?v=2.0.0"></script>
    <script src="/static/js/pages/results.js?v=2.0.0"></script>
    <script src="/static/js/pages/report.js?v=2.0.0"></script>
    <script src="/static/js/pages/dataset.js?v=2.0.0"></script>
    <script src="/static/js/app.js?v=2.0.0"></script>
</body>
</html>
